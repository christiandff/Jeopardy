<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Jeopardy – Spiller</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100dvh; padding: 16px; gap: 14px; }
  .center { margin: auto 0; display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .me { font-weight: 700; } .pts { font-size: 1.6rem; font-weight: 900; color: var(--gold); }
  .clue { background: var(--blue); border-radius: 14px; padding: 18px; text-align: center; }
  .dd { background: var(--gold); color: #1a1400; font-weight: 900; border-radius: 99px; padding: .3em 1em; margin-bottom: 10px; display: inline-block; animation: ddpop .5s ease-out; }
  @keyframes ddpop { from { transform: scale(.4); opacity: 0; } }
  .clue .meta { color: var(--gold); font-weight: 800; text-transform: uppercase; font-size: .9rem; }
  .clue .q { font-size: 1.4rem; font-weight: 700; margin-top: 8px; }
  .clue .a { margin-top: 12px; color: var(--ok); font-weight: 800; font-size: 1.2rem; }
  #buzz { flex: 1; min-height: 40dvh; border-radius: 50%; aspect-ratio: 1; max-height: 60vw; align-self: center;
    width: min(80vw, 340px); font-size: 2rem; font-weight: 900; letter-spacing: .05em; background: var(--bad);
    box-shadow: 0 10px 0 #8e1f14; transition: transform .05s; touch-action: manipulation; }
  #buzz:active:not(:disabled) { transform: translateY(8px); box-shadow: 0 2px 0 #8e1f14; }
  #buzz.ready { background: var(--ok); box-shadow: 0 10px 0 #1b7a43; animation: pulse 1s infinite; }
  #buzz.ready:active { box-shadow: 0 2px 0 #1b7a43; }
  #buzz.mine { background: var(--gold); color: #1a1400; box-shadow: 0 10px 0 #a37d0a; opacity: 1; }
  @keyframes pulse { 50% { filter: brightness(1.2); } }
  .status { text-align: center; font-size: 1.1rem; min-height: 1.5em; }
  .mini { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-size: .85rem; }
  .mini span { background: var(--panel); padding: 4px 10px; border-radius: 99px; }
  #helpBtn { width: 2em; height: 2em; padding: 0; border-radius: 50%; font-weight: 900; margin-left: 8px; }
  #howto { position: fixed; inset: 0; z-index: 20; background: var(--blue); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 18px; }
  #howto[hidden] { display: none; }
  #howto .ico { font-size: 4.5rem; line-height: 1; }
  #howto h2 { color: var(--gold); font-size: 1.7rem; }
  #howto p { font-size: 1.2rem; line-height: 1.4; max-width: 26em; }
  #howto .dots { display: flex; gap: 8px; }
  #howto .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  #howto .dots i.on { background: var(--gold); }
  #howto .step { animation: hwin .25s ease-out; }
  @keyframes hwin { from { transform: translateX(30px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #howto .step { animation: none; } }
</style>
</head>
<body>
<div id="conn" hidden>Mistet forbindelsen – kobler til på nytt…</div>

<div id="join" class="center" hidden>
  <h1 class="logo" style="font-size:3rem;text-align:center">Jeopardy!</h1>
  <input id="name" maxlength="20" placeholder="Skriv navnet ditt" autocomplete="off">
  <button id="joinBtn" class="gold" style="padding:1em">Bli med</button>
  <div id="joinErr" class="muted" style="text-align:center"></div>
</div>

<div id="game" style="display:none;flex-direction:column;gap:14px;flex:1">
  <div class="top"><span class="me" id="me"></span><span><span class="pts" id="pts">0</span><button id="helpBtn" class="ghost" aria-label="Slik spiller du">?</button></span></div>
  <div id="clue"></div>
  <button id="buzz" disabled>BUZZ!</button>
  <div class="status" id="status"></div>
  <div class="status" id="tleft" style="font-weight:800;color:var(--gold)"></div>
  <div class="mini" id="mini"></div>
</div>

<div id="howto" hidden role="dialog" aria-label="Slik spiller du">
  <div class="step" id="hwStep"></div>
  <div class="dots" id="hwDots"></div>
  <button id="hwNext" class="gold" style="padding:1em 2em"></button>
  <button id="hwSkip" class="ghost">Hopp over</button>
</div>

<script src="/common.js"></script>
<script>
let pid = localStorage.getItem('jp_pid');
let myName = localStorage.getItem('jp_name') || '';
let state = null;
const $ = id => document.getElementById(id);

const conn = connect(() => ({ role: 'player', pid, name: myName }), msg => {
  if (msg.type === 'joined') {
    pid = msg.pid; myName = msg.name;
    localStorage.setItem('jp_pid', pid); localStorage.setItem('jp_name', myName);
    showGame();
  } else if (msg.type === 'needName') {
    $('join').hidden = false; $('game').style.display = 'none';
  } else if (msg.type === 'nameTaken') {
    $('join').hidden = false; $('game').style.display = 'none';
    $('joinErr').textContent = 'Det navnet er allerede i bruk. Velg et annet.';
  } else if (msg.type === 'kicked') {
    localStorage.removeItem('jp_pid'); pid = null; location.reload();
  } else if (msg.type === 'state') {
    state = msg.state; render();
  }
});

function showGame() {
  $('join').hidden = true; $('game').style.display = 'flex'; $('me').textContent = myName; render();
  let seen = false;
  try { seen = !!localStorage.getItem('jp_howto_seen'); } catch (e) {}
  if (!seen) openHowto();
}

// ----- Slik spiller du -----
function howtoSteps(st) {
  const turns = st && st.mode === 'turns';
  return [
    { ico: '🎯', h: 'Slik fungerer det', p: 'Spørsmålet vises på storskjermen. Du svarer høyt, og mobilen din er buzzeren.' },
    turns
      ? { ico: '🙋', h: 'Tur for tur', p: 'Lagene bytter på å velge rute og svare. Når det er din tur, svarer du uten å buzze. Du ser «DIN TUR!» på mobilen.' }
      : { ico: '🔔', h: 'Buzz!', p: 'Når spørsmålet har dukket opp, blir knappen grønn. Trykk så fort du kan. Den som trykker først, får svare.' },
    { ico: '✔✘', h: 'Poeng og stjeling', p: 'Riktig svar gir poeng. ' + (st && st.penalty === false ? 'Svarer du feil, er du utestengt på spørsmålet' : 'Svarer du feil, mister du halvparten av poengene (og er utestengt på spørsmålet)') + ', og så åpnes buzzeren: alle de andre kan trykke og stjele poengene!' },
    { ico: '⭐', h: 'Lurt å vite', p: 'Noen ruter gir dobbel poengsum, og de er skjult.'
      + (turns ? ' Etter hvert spørsmål er det neste lag sin tur.'
        : st && st.chooserFirst ? ' Laget som velger en rute, får svare først.' : ' Den som svarer riktig, velger neste rute.') },
  ];
}
let hwI = 0;
function renderHowto() {
  const steps = howtoSteps(state && state.settings), s = steps[hwI];
  const last = hwI === steps.length - 1;
  const el = $('hwStep'); el.style.animation = 'none'; el.offsetWidth; el.style.animation = '';
  el.innerHTML = `<div class="ico">${s.ico}</div><h2>${esc(s.h)}</h2><p>${esc(s.p)}</p>`;
  $('hwDots').innerHTML = steps.map((_, i) => `<i class="${i === hwI ? 'on' : ''}"></i>`).join('');
  $('hwNext').textContent = last ? 'Skjønner!' : 'Neste';
  $('hwSkip').hidden = last;
}
function openHowto() { hwI = 0; renderHowto(); $('howto').hidden = false; }
function closeHowto() {
  $('howto').hidden = true;
  try { localStorage.setItem('jp_howto_seen', '1'); } catch (e) {}
}
$('hwNext').onclick = () => { if (hwI >= howtoSteps(state && state.settings).length - 1) closeHowto(); else { hwI++; renderHowto(); } };
$('hwSkip').onclick = closeHowto;
$('helpBtn').onclick = openHowto;

$('joinBtn').onclick = () => {
  const n = $('name').value.trim();
  if (!n) { $('joinErr').textContent = 'Skriv inn et navn først'; return; }
  myName = n; pid = null;
  conn.send({ type: 'hello', role: 'player', pid: null, name: myName });
};
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });

$('buzz').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (navigator.vibrate) navigator.vibrate(60);
  conn.send({ type: 'player', action: 'buzz' });
});

let deadlineAt = null;
function tickTimer() {
  const el = $('tleft');
  el.textContent = deadlineAt ? `⏱ ${Math.max(0, Math.ceil((deadlineAt - Date.now()) / 1000))} s` : '';
}
setInterval(tickTimer, 250);

function render() {
  if (!state || !pid) return;
  const me = state.players.find(p => p.id === pid);
  if (!me) return;
  $('pts').textContent = me.score;
  const cur = state.current;
  const buzz = $('buzz');
  buzz.className = ''; buzz.disabled = true;
  let status = '';
  const answeringP = cur && state.players.find(p => p.id === cur.answering);

  if (!state.started) {
    $('clue').innerHTML = '';
    buzz.textContent = '⏳';
    status = 'Du er med! Venter på at spillet starter…';
  } else if (!cur) {
    $('clue').innerHTML = '';
    const ch = state.players.find(p => p.id === state.chooser);
    status = ch ? (ch.id === pid ? '🎯 Det er DIN tur å velge!' : `${esc(ch.name)} velger neste spørsmål`) : 'Venter på at admin velger spørsmål…';
    buzz.textContent = 'Venter';
  } else {
    $('clue').innerHTML = `<div class="clue">${cur.double ? '<div class="dd">⭐ Dobbel poengsum! ⭐</div>' : ''}<div class="meta">${esc(cur.category)} · ${cur.value}</div>
      <div class="q">${esc(cur.q) || (cur.hasYt ? '🎵 Hør på storskjermen!' : '')}</div>${imgTag(cur.img)}${cur.a ? `<div class="a">Svar: ${esc(cur.a)}</div>${imgTag(cur.aImg)}` : ''}</div>`;
    const locked = cur.lockedOut.includes(pid);
    if (cur.phase === 'read') { buzz.textContent = 'Vent…'; status = 'Spørsmålet leses opp'; }
    else if (cur.phase === 'open') {
      if (locked) { buzz.textContent = 'Utestengt'; status = 'Du svarte feil på dette'; }
      else { buzz.disabled = false; buzz.className = 'ready'; buzz.textContent = 'BUZZ!'; status = 'Trykk når du vet svaret!'; }
    } else if (cur.phase === 'answering') {
      if (cur.answering === pid) { buzz.className = 'mine'; buzz.textContent = 'DIN TUR!'; status = cur.first ? 'Du valgte ruten – du svarer først!' : 'Svar muntlig nå'; }
      else { buzz.textContent = 'Låst'; status = cur.first ? `${esc(answeringP?.name || '?')} valgte ruten og svarer først` : `${esc(answeringP?.name || '?')} svarer…`; }
    } else { buzz.textContent = 'Ferdig'; status = 'Riktig svar vises'; }
  }
  $('status').innerHTML = status;
  deadlineAt = cur && cur.deadline ? cur.deadline - (state.serverNow - Date.now()) : null;
  tickTimer();
  $('mini').innerHTML = state.players.map(p =>
    `<span style="${p.id === pid ? 'outline:1px solid var(--gold)' : ''}">${esc(p.name)}: ${p.score}</span>`).join('');
}
</script>
</body>
</html>
